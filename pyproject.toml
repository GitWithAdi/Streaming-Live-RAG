[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-live-rag"
version = "1.0.0"
description = "Real-Time Incremental Retrieval, Multi-Intent Decomposition, and State-Preserving Answer Refinement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "sentence-transformers>=2.3.0",
    "transformers>=4.38.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "rich>=13.7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
